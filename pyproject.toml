[project]
name = "sqlcases"
version = "0.1.0"
description = "SQL case studies: 8 Week SQL Challenge cases 1-4 plus a synthetic Malaysian e-wallet analytics case on PostgreSQL."
authors = [{ name = "Zeeq" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "psycopg[binary]>=3.2",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.0",
    "streamlit>=1.67.0",
]

[project.scripts]
sqlcases = "sqlcases.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the Postgres container running"]
